name: Refresh Worker Types Lock

on:
  push:
    branches:
      - launch/security-release-2026-08-26
    paths:
      - .github/workflows/refresh-worker-types-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/security-release-2026-08-26
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Refresh lock with compatible Worker runtime types
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Worker type lock
        run: node -e "const l=require('./package-lock.json'); const p=l.packages?.['node_modules/@cloudflare/workers-types']; if(p?.version!=='4.20260702.1') throw new Error('Unexpected Worker types '+p?.version)"
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'Resolve Vestraglobe Worker type dependency lock' || exit 0
          git push origin HEAD:launch/security-release-2026-08-26
